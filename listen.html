<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Listen">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="phone/apple-touch-icon.png">
<title>Listen</title>
<style>
  :root { --night: #05070d; --ink: rgba(255,255,255,.92); --label: rgba(255,255,255,.78); --muted: rgba(255,255,255,.45);
          --glass: rgba(255,255,255,.07); --rim: rgba(255,255,255,.14); --live: #ffb15c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--night); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    background: radial-gradient(120% 70% at 50% 110%, #12203a 0%, var(--night) 60%); }
  .cap { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--label); text-align: center; }
  #main { display: grid; justify-items: center; gap: 28px; }
  #btn { position: relative; width: 220px; height: 220px; border-radius: 50%; border: 0; color: var(--ink);
    background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.12), var(--glass) 60%); box-shadow: 0 0 0 1px var(--rim), 0 20px 60px rgba(0,0,0,.5);
    font: inherit; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; -webkit-tap-highlight-color: transparent;
    transition: transform .14s cubic-bezier(.23,1,.32,1), box-shadow .3s; }
  #btn:active { transform: scale(.97); }
  #btn:disabled { opacity: .4; }
  #btn.live { box-shadow: 0 0 0 1px rgba(255,177,92,.5), 0 0 calc(20px + var(--lv, 0) * 90px) rgba(255,140,40,calc(.15 + var(--lv, 0) * .6)), 0 20px 60px rgba(0,0,0,.5); color: var(--live); }
  #status { min-height: 20px; font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  #setup { display: none; max-width: 420px; width: 100%; gap: 16px; }
  #setup p { font-size: 14px; color: var(--label); }
  #setup code { display: block; padding: 12px; border-radius: 12px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px var(--rim);
    font: 12px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; user-select: all; -webkit-user-select: all; }
  #setup button, #setup a { display: block; padding: 14px; border-radius: 14px; border: 0; background: var(--glass); box-shadow: 0 0 0 1px var(--rim);
    color: var(--ink); font: inherit; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; text-align: center; text-decoration: none; }
</style>
<script>
  // Home Screen apps don't share Safari's URL, so keep a copy of the key on this phone.
  try { var m = location.hash.match(/key=([A-Za-z0-9_-]{32,})/);
        if (m) localStorage.setItem("gsl.key", m[1]); else if (localStorage.getItem("gsl.key")) location.hash = "key=" + localStorage.getItem("gsl.key"); } catch (e) {}
  window.GSL_LISTENER = 1;
</script>
<script src="listen.js"></script>
</head>
<body>
<div id="main">
  <div class="cap">The Goose Sauna</div>
  <button id="btn" disabled>Connecting</button>
  <div id="status"></div>
  <audio id="out" playsinline></audio>
</div>
<div id="setup">
  <div class="cap">Pair once</div>
  <p>1. Tablet: set Fully's Start URL to this, then reload.</p>
  <code id="tabletUrl"></code>
  <button id="copyT">Copy tablet URL</button>
  <p>2. iPhone: open your listener, then Share &gt; Add to Home Screen.</p>
  <a id="openL" href="#">Open my listener</a>
  <p>Keep both links private. Anyone with them can listen.</p>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var btn = $("btn"), status = $("status"), out = $("out");

  if (!GSL.key) { // first run: make a key on this phone
    var k = GSL.b64(crypto.getRandomValues(new Uint8Array(32)));
    var base = location.href.split("#")[0];
    $("tabletUrl").textContent = base.replace(/listen\.html$/, "test.html") + "#key=" + k;
    $("openL").href = base + "#key=" + k;
    $("openL").onclick = function () { setTimeout(function () { location.reload(); }, 50); };
    $("copyT").onclick = function () { navigator.clipboard.writeText($("tabletUrl").textContent).then(function () { $("copyT").textContent = "Copied"; }); };
    $("main").style.display = "none"; $("setup").style.display = "grid";
    return;
  }

  var ch = null, pc = null, id = null, timer = null, live = false, actx = null, meter = 0;
  function say(t) { status.textContent = t; }
  function stop(sendBye) {
    clearTimeout(timer); cancelAnimationFrame(meter);
    if (sendBye && ch && id) ch.send({ t: "bye", id: id });
    if (pc) pc.close();
    pc = id = null; live = false; out.pause(); out.srcObject = null;
    btn.classList.remove("live"); btn.style.removeProperty("--lv");
  }
  function connect() {
    stop(true);
    btn.disabled = true; btn.textContent = "Connecting"; say("");
    id = GSL.b64(crypto.getRandomValues(new Uint8Array(9)));
    var myId = id, p = new RTCPeerConnection({ iceServers: GSL.ICE });
    pc = p;
    p.addTransceiver("audio", { direction: "recvonly" });
    p.ontrack = function (e) { out.srcObject = e.streams[0] || new MediaStream([e.track]); };
    p.onconnectionstatechange = function () {
      if (pc !== p) return;
      if (p.connectionState === "connected") { clearTimeout(timer); btn.disabled = false; btn.textContent = live ? "Stop" : "Listen"; say(live ? "Live" : "Ready"); }
      if (/failed|disconnected/.test(p.connectionState)) fail("Lost the tablet - tap to retry");
    };
    p.createOffer().then(function (o) { return p.setLocalDescription(o); })
      .then(function () { return GSL.gathered(p); })
      .then(function () { if (pc === p) return ch.send({ t: "offer", id: myId, sdp: p.localDescription.sdp }); })
      .catch(function () { fail("Couldn't reach the relay - tap to retry"); });
    timer = setTimeout(function () { if (pc === p && p.connectionState !== "connected") fail("Tablet not answering - tap to retry"); }, 15000);
  }
  function fail(msg) { stop(true); btn.disabled = false; btn.textContent = "Retry"; say(msg); }

  function meterLoop(stream) { // the glow follows the room's loudness
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume();
      var an = actx.createAnalyser(); an.fftSize = 512; actx.createMediaStreamSource(stream).connect(an);
      var buf = new Uint8Array(an.fftSize);
      (function tick() {
        an.getByteTimeDomainData(buf); var peak = 0;
        for (var i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
        btn.style.setProperty("--lv", Math.min(1, peak / 48).toFixed(2));
        meter = requestAnimationFrame(tick);
      })();
    } catch (e) {}
  }

  btn.onclick = function () {
    if (btn.textContent === "Retry") return connect();
    if (!pc || !out.srcObject) return;
    live = !live;
    if (live) { out.muted = false; out.play(); meterLoop(out.srcObject); btn.classList.add("live"); btn.textContent = "Stop"; say("Live"); }
    else { out.pause(); cancelAnimationFrame(meter); btn.classList.remove("live"); btn.textContent = "Listen"; say("Ready"); }
  };

  GSL.setup().then(function (c) {
    ch = c;
    var es = ch.listen(function (m) {
      if (m.id !== id || !pc) return;
      if (m.t === "answer") pc.setRemoteDescription({ type: "answer", sdp: m.sdp }).catch(function () { fail("Bad answer - tap to retry"); });
      if (m.t === "err") fail("Tablet mic blocked (" + m.why + ")");
    });
    es.onopen = function () { if (!pc && !document.hidden) connect(); }; // subscribe first, so the answer can't be missed
  });
  // Lock the phone or leave the app: hang up so the tablet mic closes.
  document.addEventListener("visibilitychange", function () { if (!ch) return; if (document.hidden) stop(true); else connect(); });
  addEventListener("pagehide", function () { stop(true); });
})();
</script>
</body>
</html>
